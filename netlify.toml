# Netlify build config for Git-linked deploys.
[build]
  publish = "public"

# Cache-bust: HTML must never be cached (SPA shell + injected boot), JS/CSS short-lived.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "no-cache"