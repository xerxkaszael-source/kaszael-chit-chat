<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kaszael Ngobrol — a comfortable place to talk with friends.">
  <meta name="theme-color" content="#0b0e14">
  <title>Kaszael Ngobrol</title>
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-straight/css/uicons-regular-straight.css" media="print" onload="this.media='all'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236c8cff'/%3E%3Cpath d='M18 24h28a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H28l-8 6v-6h-2a6 6 0 0 1-6-6v-8a6 6 0 0 1 6-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/themes.css">
  <script src="vendor/supabase.js"></script>
  <script>
    // dev trap: surface any uncaught error on-screen instead of a frozen loader
    window.addEventListener('error', function (e) {
      var t = document.getElementById('boot-error');
      if (t) { t.style.display = 'block'; t.textContent = 'JS error: ' + (e.message || 'unknown'); }
    });
    window.addEventListener('unhandledrejection', function (e) {
      var t = document.getElementById('boot-error');
      if (t) { t.style.display = 'block'; t.textContent = 'Async error: ' + (e.reason && (e.reason.message || String(e.reason)) || 'unknown'); }
    });
  </script>
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <div class="boot">
      <svg class="boot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6c8cff"/>
            <stop offset="1" stop-color="#8aa5ff"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#bootGrad)"/>
        <path d="M18 24h28a6 6 0 0 1 6 6v8a6 6 0 0 1-6 6H28l-8 6v-6h-2a6 6 0 0 1-6-6v-8a6 6 0 0 1 6-6z" fill="white"/>
      </svg>
      <p class="boot-text">Loading Kaszael Ngobrol… <span id="boot-ver" style="opacity:.5;font-size:11px">(build __BUILD_SHA__)</span></p>
      <p id="boot-error" style="display:none;color:#ff6c9d;font-family:monospace;font-size:12px;padding:8px;max-width:90%;word-break:break-word"></p>
    </div>
  </div>
  <div id="modals" aria-live="assertive"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
