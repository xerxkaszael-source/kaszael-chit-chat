name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject short commit SHA into index.html so users can verify which
      # commit they are running (replaces __BUILD_SHA__ placeholder).
      - name: Inject build SHA
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/__BUILD_SHA__/${SHORT_SHA}/g" public/index.html
          echo "Build marker: $(grep -o 'build [a-z0-9]\{7\}' public/index.html)"

      # config.js already ships the public Supabase URL + anon key, so no build
      # step is needed — publish the public/ directory directly.

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./public
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5