name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject short commit SHA into index.html so users can verify which
      # commit they are running (replaces __BUILD_SHA__ placeholder).
      - name: Inject build SHA
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/__BUILD_SHA__/${SHORT_SHA}/g" public/index.html
          echo "Build marker: $(grep -o 'build [a-z0-9]\{7\}' public/index.html)"

      # config.js already ships the public Supabase URL + anon key, so no
      # build step is needed — publish the public/ directory directly.
      #
      # Vercel deploy via CLI. Token is stored as a repo secret.
      # We pin the CLI version for reproducible builds.
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}